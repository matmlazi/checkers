{{- $p := .Values.namePrefix }}
{{- if and .Values.podMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PodMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $p }}checkers
spec:
  selector:
    matchLabels:
      app: {{ $p }}checkers-web
  podMetricsEndpoints:
    - port: metrics
{{- end }}
