{{- $p := .Values.namePrefix }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $p }}checkers
spec:
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $p }}checkers-web
                port:
                  name: {{ ternary "https" "http" .Values.https.enabled }}
