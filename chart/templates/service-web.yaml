{{- $p := .Values.namePrefix }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $p }}checkers-web
  {{- if .Values.https.enabled }}
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: {{ printf "%s-%scheckers-tls@kubernetescrd" .Release.Namespace $p | quote }}
  {{- end }}
  labels:
    app: {{ $p }}checkers-web
spec:
  selector:
    app: {{ $p }}checkers-web
  ports:
    - name: {{ ternary "https" "http" .Values.https.enabled }}
      port: {{ ternary 443 3000 .Values.https.enabled }}
      targetPort: {{ ternary "https" "http" .Values.https.enabled }}
